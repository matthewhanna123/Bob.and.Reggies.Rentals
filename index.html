<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="Bob&ReggieRentalsLLCLogo.png">
    <title>Bob & Reggie's Rentals | Intake Form</title>
    
    <!-- PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --navy: #1a2b3c;
            --sky-blue: #c5dbe9;
            --cream: #fdf5e6;
            --white: #ffffff;
        }

        body { 
            background: var(--cream); 
            color: var(--navy); 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding-bottom: 100px; 
        }

        /* Header & Toggle */
        .header { 
            background: var(--white); 
            padding: 10px 15px; 
            border-bottom: 3px solid var(--sky-blue); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }
        .logo-img { height: 120px; }
        .direct-link { font-weight: bold; text-decoration: none; color: var(--navy); font-size: 14px; }

        .trip-toggle {
            display: flex;
            justify-content: center;
            padding: 15px;
            gap: 10px;
        }
        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--navy);
            background: var(--white);
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-btn.active { background: var(--navy); color: var(--white); }

        /* Grid System */
        .section-title { 
            padding: 20px 15px 5px; 
            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-bottom: 1px solid var(--sky-blue);
            margin-bottom: 10px;
        }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        
        .card { 
            background: var(--white); 
            border-radius: 8px; 
            aspect-ratio: 1/1; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid var(--sky-blue); 
            overflow: hidden; 
        }
        
        .placeholder-img { width: 60%; opacity: 0.3; }
        .captured-img { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; z-index: 2; }
        
        .label { 
            position: absolute; bottom: 0; width: 100%;
            background: rgba(26, 43, 60, 0.8); color: white;
            font-size: 9px; padding: 4px 0; text-align: center; z-index: 3;
        }
        .add-btn { 
            position: absolute; top: 10px; right: 10px; 
            background: var(--sky-blue); color: var(--navy); 
            width: 25px; height: 25px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; z-index: 4; 
        }

        .submit-area { position: fixed; bottom: 0; width: 100%; padding: 15px; box-sizing: border-box; background: var(--white); border-top: 2px solid var(--sky-blue); z-index: 999;}
        .btn-submit { width: 100%; background: var(--navy); color: white; border: none; padding: 15px; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer;}
    </style>
</head>
<body>
    <div id="access-denied" style="display:none; text-align:center; padding:50px; font-family: sans-serif;">
        <h1>Access Denied</h1>
        <p>This is a private portal for Bob & Reggie Rentals LLC.</p>
    </div>

    <div id="main-content" style="display:none;">

        <div class="header">
            <img src="Bob&ReggieRentalsLLCLogo.png" class="logo-img" alt="Logo">
            <a href="direct-rentals.html" class="direct-link">DIRECT BOOKING →</a>
        </div>

        <div class="trip-toggle">
            <button class="toggle-btn active" onclick="setTripType('Pre-Trip', this)">PRE-TRIP</button>
            <button class="toggle-btn" onclick="setTripType('Post-Trip', this)">POST-TRIP</button>
        </div>

        <div class="form-container"> <!-- Wrapper for PDF capture -->
            <div class="section-title">The Basics</div>
            <div class="photo-grid">
                <div class="card" onclick="openCam('in-odo')">
                    <img src="placeholder-icon.png" class="placeholder-img">
                    <div class="label">Odometer</div><div class="add-btn">+</div>
                    <img id="img-odo" class="captured-img">
                    <input type="file" id="in-odo" accept="image/*" capture="camera" hidden onchange="pv(this, 'img-odo')">
                </div>
                <div class="card" onclick="openCam('in-bat')">
                    <img src="placeholder-icon.png" class="placeholder-img">
                    <div class="label">Battery Level</div><div class="add-btn">+</div>
                    <img id="img-bat" class="captured-img">
                    <input type="file" id="in-bat" accept="image/*" capture="camera" hidden onchange="pv(this, 'img-bat')">
                </div>
            </div>

            <div class="section-title">Exterior Walkaround</div>
            <div class="photo-grid" id="exterior-grid"></div>

            <div class="section-title">Interior & Cargo</div>
            <div class="photo-grid" id="interior-grid"></div>
        </div>

        <div class="submit-area">
            <button class="btn-submit" id="submit-btn" onclick="submitPhotos()">SUBMIT TRIP PHOTOS</button>
        </div> 
    </div>

<script>
    // --- Authorization Check ---
    (function() {
        const authKey = 'br_rentals_authorized';
        const mainContent = document.getElementById('main-content');
        const accessDenied = document.getElementById('access-denied');

        if (window.location.hash === '#authorize') {
            localStorage.setItem(authKey, 'true');
            history.replaceState("", document.title, window.location.pathname);
        }

        if (localStorage.getItem(authKey) === 'true') {
            mainContent.style.display = 'block';
        } else {
            accessDenied.style.display = 'block';
        }
    })();

    let currentTripType = 'Pre-Trip';

    function setTripType(type, btn) {
        currentTripType = type;
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    const exteriorData = [
        { label: "Front", img: "front.png" }, { label: "Hood", img: "hood.png" }, { label: "Front Driver Corner", img: "front-dr-corner.png" },
        { label: "Front Driver Panel", img: "front-dr-panel.png" }, { label: "Front Driver Wheel", img: "front-dr-wheel.png" }, { label: "Front Driver Door", img: "front-dr-door.png" },
        { label: "Back Driver Door", img: "back-dr-door.png" }, { label: "Back Driver Panel", img: "back-dr-panel.png" }, { label: "Back Driver Wheel", img: "back-dr-wheel.png" },
        { label: "Back Driver Corner", img: "back-dr-corner.png" }, { label: "Rear", img: "rear.png" }, { label: "Back Pass Corner", img: "back-pass-corner.png" },
        { label: "Back Pass Panel", img: "back-pass-panel.png" }, { label: "Back Pass Wheel", img: "back-pass-wheel.png" }, { label: "Back Pass Door", img: "back-pass-door.png" },
        { label: "Front Pass Door", img: "front-pass-door.png" }, { label: "Front Pass Panel", img: "front-pass-panel.png" }, { label: "Front Pass Wheel", img: "front-pass-wheel.png" },
        { label: "Front Pass Corner", img: "front-pass-corner.png" }, { label: "Undercarriage Front", img: "under-front.png"}, { label: "Undercarriage Mid-Front", img: "under-mid-front.png"},
        { label: "Undercarriage Mid-Back", img: "under-mid-back.png"}, { label: "Undercarriage Back", img: "under-back.png"}
    ];

    const interiorData = [
        { label: "Driver Seat", img: "dr-seat.png" }, { label: "Driver Door Panel", img: "dr-door.png" }, { label: "Driver Floor Mat", img: "dr-mat.png" },
        { label: "Dash View", img: "dash.png" }, { label: "Console Open", img: "console-open.png" }, { label: "Console Closed", img: "console-closed.png" },
        { label: "Trunk", img: "trunk.png" }, { label: "Frunk", img: "frunk.png" }
    ];

    function createCards(data, containerId) {
        const container = document.getElementById(containerId);
        data.forEach((item, index) => {
            const id = containerId + index;
            container.innerHTML += `
                <div class="card" onclick="openCam('in-${id}')">
                    <img src="${item.img}" class="placeholder-img" onerror="this.src='placeholder-icon.png'">
                    <div class="label">${item.label}</div><div class="add-btn">+</div>
                    <img id="img-${id}" class="captured-img">
                    <input type="file" id="in-${id}" data-label="${item.label}" accept="image/*" capture="camera" hidden onchange="pv(this, 'img-${id}')">
                </div>`;
        });
    }

    createCards(exteriorData, 'exterior-grid');
    createCards(interiorData, 'interior-grid');

    function openCam(id) { document.getElementById(id).click(); }
    
    function pv(input, imgId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(imgId);
                img.src = e.target.result;
                img.style.display = 'block';
                input.parentElement.querySelector('.placeholder-img').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // --- Submission Logic ---
    async function submitPhotos() {
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxtl_ppBeHh83wEdCIVHXuJ0TCX1MYEu7ygfbbOLvIXuCszRab1Svk7U4g3Ac4orZ95/exec';
        const btn = document.getElementById('submit-btn');
        
        btn.innerText = "UPLOADING TO GOOGLE...";
        btn.disabled = true;

        try {
            // 1. Generate PDF
            const element = document.querySelector('.form-container');
            const pdfBase64 = await html2pdf().from(element).outputPdf('datauristring').then(uri => uri.split(',')[1]);

            // 2. Collect all photos
            const fileData = [];
            const allInputs = document.querySelectorAll('input[type="file"]');
            
            for (const input of allInputs) {
                if (input.files[0]) {
                    const base64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.readAsDataURL(input.files[0]);
                    });
                    fileData.push({
                        name: (input.getAttribute('data-label') || input.id) + ".jpg",
                        type: "image/jpeg",
                        base64: base64
                    });
                }
            }

            // 3. Send Payload
            const formData = new FormData();
            formData.append('tripType', currentTripType);
            formData.append('pdfBase64', pdfBase64);
            formData.append('fileData', JSON.stringify(fileData));

            const response = await fetch(scriptURL, { method: 'POST', body: formData });
            const result = await response.text();

            if (result === "Success") {
                alert("Upload Complete! " + currentTripType + " files saved to Drive.");
                location.reload();
            } else {
                throw new Error(result);
            }

        } catch (err) {
            alert("Upload failed. Please check connection and try again.");
            console.error(err);
            btn.innerText = "SUBMIT TRIP PHOTOS";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
