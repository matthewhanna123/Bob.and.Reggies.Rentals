<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Direct Booking | Bob & Reggie</title>
    <style>
        :root { --navy: #1a2b3c; --sky-blue: #c5dbe9; --cream: #fdf5e6; --white: #ffffff; }
        body { background: var(--cream); color: var(--navy); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 40px; }
        
        .header { background: var(--white); padding: 15px; border-bottom: 3px solid var(--sky-blue); text-align: center; }
        .logo-img { height: 80px; }
        
        .form-container { padding: 20px; max-width: 500px; margin: auto; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; text-transform: uppercase; }
        input[type="text"], input[type="date"] { width: 100%; padding: 12px; border: 2px solid var(--sky-blue); border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .card { background: var(--white); border: 2px dashed var(--sky-blue); border-radius: 12px; aspect-ratio: 3/2; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .captured-img { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; z-index: 2; }
        .placeholder-svg { width: 40%; fill: var(--sky-blue); opacity: 0.6; }
        .add-btn { position: absolute; bottom: 10px; background: var(--navy); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 3; }

        /* Signature Pad */
        #sig-canvas { border: 2px solid var(--navy); background: white; border-radius: 8px; touch-action: none; cursor: crosshair; width: 100%; height: 150px; }
        .sig-buttons { margin-top: 10px; display: flex; gap: 10px; }

        .btn-pay { display: block; width: 100%; background: #422dbe; color: white; border: none; padding: 18px; border-radius: 8px; font-weight: bold; font-size: 18px; margin-top: 30px; text-decoration: none; text-align: center; }
        .btn-clear { background: #888; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <img src="Bob&ReggieRentalsLLCLogo.png" class="logo-img" alt="Logo">
</div>

<div class="form-container">
    <div class="input-group">
        <label>Renter Name</label>
        <input type="text" value="Matthew Elliot Hanna">
    </div>

    <div class="input-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Start Date</label>
            <input type="date">
        </div>
        <div style="flex: 1;">
            <label>End Date</label>
            <input type="date">
        </div>
    </div>

    <label>Driver's License (Front & Back)</label>
    <div class="photo-grid">
        <div class="card" onclick="openCam('in-dl-f')">
            <svg class="placeholder-svg" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 8H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
            <div class="add-btn">+</div>
            <img id="img-dl-f" class="captured-img">
            <input type="file" id="in-dl-f" accept="image/*" capture="camera" hidden onchange="pv(this, 'img-dl-f')">
        </div>
        <div class="card" onclick="openCam('in-dl-b')">
            <svg class="placeholder-svg" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 6h16v2H4V6zm16 12H4v-8h16v8z"/></svg>
            <div class="add-btn">+</div>
            <img id="img-dl-b" class="captured-img">
            <input type="file" id="in-dl-b" accept="image/*" capture="camera" hidden onchange="pv(this, 'img-dl-b')">
        </div>
    </div>

    <label>Sign with Finger</label>
    <canvas id="sig-canvas"></canvas>
    <div class="sig-buttons">
        <button class="btn-clear" onclick="clearSig()">Clear Signature</button>
    </div>

    <!-- Square Checkout Link -->
    <a href="https://square.link/u/YOUR_LINK_HERE" class="btn-pay">PAY VIA SQUARE</a>
</div>

<script>
    function openCam(id) { document.getElementById(id).click(); }
    function pv(input, imgId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById(imgId);
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Signature Pad Logic
    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    // Resize canvas for high resolution
    const ratio = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#1a2b3c';

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function start(e) { drawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }
    function draw(e) { if (!drawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
    function stop() { drawing = false; }

    canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', draw); canvas.addEventListener('touchend', stop);
    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stop);

    function clearSig() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
</script>

</body>
</html>
