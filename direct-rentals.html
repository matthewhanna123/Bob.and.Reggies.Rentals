<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Direct Booking | Bob & Reggie</title>
    <style>
        :root { --navy: #1a2b3c; --sky-blue: #c5dbe9; --cream: #fdf5e6; --white: #ffffff; }
        body { background: var(--cream); color: var(--navy); font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 40px; }
        
        .header { background: var(--white); padding: 10px 15px; border-bottom: 3px solid var(--sky-blue); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-img { height: 120px; }
        
        .form-container { padding: 20px; max-width: 500px; margin: auto; box-sizing: border-box; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; text-transform: uppercase; }
        input[type="text"], input[type="email"], input[type="date"] { width: 100%; padding: 12px; border: 2px solid var(--sky-blue); border-radius: 8px; box-sizing: border-box; font-size: 16px; }

        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .card { background: var(--white); border: 2px dashed var(--sky-blue); border-radius: 12px; aspect-ratio: 3/2; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .captured-img { width: 100%; height: 100%; object-fit: cover; display: none; position: absolute; top: 0; z-index: 2; }
        .placeholder-svg { width: 45%; fill: var(--sky-blue); opacity: 0.7; }
        .add-btn { position: absolute; bottom: 10px; background: var(--navy); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 3; }

        .agreement-box { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid var(--sky-blue); margin-bottom: 20px; }
        .agreement-text { max-height: 100px; overflow-y: scroll; font-size: 11px; color: #666; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; line-height: 1.4; }

        #sig-canvas { border: 2px solid var(--navy); background: white; border-radius: 8px; touch-action: none; width: 100%; height: 150px; box-sizing: border-box; }
        
        .price-summary { background: var(--navy); color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }

        /* UNIFORM ACTION BUTTON */
        .btn-pay { 
            display: block; 
            width: 100%; 
            background: #422dbe; 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 18px; 
            margin-top: 30px; 
            text-align: center; 
            box-sizing: border-box; 
            cursor: pointer;
            opacity: 0.4;
            pointer-events: none;
        }
        .btn-clear { background: #888; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 12px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="access-denied" style="display:none; text-align:center; padding:100px 20px;">
    <h1>404 Not Found</h1>
    <p>The requested URL was not found on this server.</p>
</div>

<div id="main-content" style="display:none;">
    <div class="header">
        <img src="Bob&ReggieRentalsLLCLogo.png" class="logo-img" alt="Logo">
    </div>

    <div class="form-container">
        <div class="input-group">
            <label>Renter Name</label>
            <input type="text" id="cust-name" value="Matthew Elliot Hanna">
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="cust-email" placeholder="email@example.com">
        </div>

        <div class="input-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Start Date</label>
                <input type="date" id="start-date" onchange="updatePrice()">
            </div>
            <div style="flex: 1;">
                <label>End Date</label>
                <input type="date" id="end-date" onchange="updatePrice()">
            </div>
        </div>

        <div id="price-box" class="price-summary">
            Total for <span id="day-count">0</span> days: <span id="display-total">$0.00</span>
        </div>

        <label>Driver's License (Front & Back)</label>
        <div class="photo-grid">
            <div class="card" onclick="openCam('in-dl-f')">
                <svg class="placeholder-svg" viewBox="0 0 24 24"><path d="M20,4H4C2.9,4,2,4.9,2,6v12c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V6C22,4.9,21.1,4,20,4z M20,18H4V6h16V18z"/><rect x="5" y="9" width="5" height="6" rx="1"/><line x1="12" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="13" x2="18" y2="13" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="16" x2="16" y2="16" stroke="currentColor" stroke-width="1.5"/></svg>
                <div class="add-btn">+</div>
                <img id="img-dl-f" class="captured-img">
                <input type="file" id="in-dl-f" accept="image/*" capture="camera" hidden onchange="pv(this, 'img-dl-f')">
            </div>
            <div class="card" onclick="openCam('in-dl-b')">
                <svg class="placeholder-svg" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 6h16v2H4V6zm16 12H4v-8h16v8z"/></svg>
                <div class="add-btn">+</div>
                <img id="img-dl-b" class="captured-img">
                <input type="file" id="in-dl-b" accept="image/*" capture="camera" hidden onchange="pv(this, 'img-dl-b')">
            </div>
        </div>

        <div class="agreement-box">
            <div class="agreement-text">
                <strong>Bob & Reggie Rentals LLC Master Agreement:</strong><br>
                Renter agrees to pay market-equivalent rates for the specified dates... [Terms Continue]
            </div>
            <label style="font-size: 13px; display: flex; align-items: flex-start; font-weight: normal;">
                <input type="checkbox" id="terms-check" style="margin-right: 12px;" onchange="togglePay()">
                <span>I agree to the terms and conditions.</span>
            </label>
        </div>

        <label>Sign with Finger</label>
        <canvas id="sig-canvas"></canvas>
        <button class="btn-clear" onclick="clearSig()">Clear Signature</button>

        <!-- ACTION BUTTON TRIGGER -->
        <button id="pay-button" class="btn-pay">PAY VIA SQUARE</button>
    </div>
</div>

<script>
    // --- AUTH LOGIC ---
    (function() {
        if (window.location.hash === '#authorize') localStorage.setItem('br_direct_only', 'true');
        if (localStorage.getItem('br_direct_only') === 'true') document.getElementById('main-content').style.display = 'block';
        else document.getElementById('access-denied').style.display = 'block';
    })();

    // --- PRICING ENGINE ---
    function updatePrice() {
        const startVal = document.getElementById('start-date').value;
        const endVal = document.getElementById('end-date').value;
        if (!startVal || !endVal) return;

        const start = new Date(startVal + "T00:00:00");
        const end = new Date(endVal + "T00:00:00");
        if (end < start) return;

        let total = 0;
        let days = 0;
        let current = new Date(start);
        const holidays = ["2026-05-25", "2026-09-07", "2026-11-26", "2026-12-25"];

        while (current <= end) {
            days++;
            const dayOfWeek = current.getDay(); 
            const dateStr = current.toISOString().split('T')[0];
            if (holidays.includes(dateStr) || [0, 5, 6].includes(dayOfWeek)) {
                total += 0.75;
            } else {
                total += 0.50;
            }
            current.setDate(current.getDate() + 1);
        }

        let discount = 1.0;
        if (days >= 5) discount = 0.80;
        else if (days === 4) discount = 0.85;
        else if (days === 3) discount = 0.90;

        const finalTotal = (total * discount).toFixed(2);
        document.getElementById('price-box').style.display = 'block';
        document.getElementById('day-count').innerText = days;
        document.getElementById('display-total').innerText = "$" + finalTotal;
    }

    function togglePay() {
        const btn = document.getElementById('pay-button');
        const checked = document.getElementById('terms-check').checked;
        btn.style.opacity = checked ? "1" : "0.4";
        btn.style.pointerEvents = checked ? "auto" : "none";
    }

    // --- CAMERA & PREVIEW ---
    function openCam(id) { document.getElementById(id).click(); }
    function pv(input, imgId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById(imgId);
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // --- SIGNATURE CANVAS ---
    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('touchstart', (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('touchmove', (e) => { if(!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    canvas.addEventListener('touchend', () => drawing = false);
    function clearSig() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // --- MASTER SUBMISSION LOGIC ---
    async function processEverything() {
        const payBtn = document.getElementById('pay-button');
        const name = document.getElementById('cust-name').value;
        const email = document.getElementById('cust-email').value;
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;

        if (!email || !start || !end) {
            alert("Please fill in all fields before paying.");
            return;
        }

        payBtn.innerText = "UPLOADING DOCUMENTS...";
        payBtn.style.background = "#888";
        payBtn.style.pointerEvents = "none";

        // Gather DL Images
        const images = [];
        ['img-dl-f', 'img-dl-b'].forEach(id => {
            const src = document.getElementById(id).src;
            if (src && src.startsWith('data:')) {
                images.push({
                    name: id + ".png",
                    type: "image/png",
                    base64: src.split(',')[1]
                });
            }
        });

        // Capture Signature
        const sigBase64 = canvas.toDataURL("image/png").split(',')[1];

        const payload = {
            name: name,
            email: email,
            start: start,
            end: end,
            images: images,
            pdfBase64: sigBase64 
        };

        // Execution Step 1: Securely upload documents to Google Drive
        google.script.run.withSuccessHandler((uploadRes) => {
            if (uploadRes.success) {
                payBtn.innerText = "REDIRECTING TO SQUARE...";
                
                // Execution Step 2: Generate Square Sandbox Checkout Link
                google.script.run.withSuccessHandler((payRes) => {
                    if (payRes.success) {
                        window.location.href = payRes.url;
                    } else {
                        alert("Square Error: " + payRes.error);
                        resetButton();
                    }
                }).createCheckout(payload);
                
            } else {
                alert("Drive Upload Error: " + uploadRes.error);
                resetButton();
            }
        }).uploadFiles(payload);
    }

    function resetButton() {
        const payBtn = document.getElementById('pay-button');
        payBtn.innerText = "PAY VIA SQUARE";
        payBtn.style.background = "#422dbe";
        payBtn.style.pointerEvents = "auto";
    }

    // Attach master process to the button
    document.getElementById('pay-button').addEventListener('click', processEverything);
</script>

</body>
</html>
